<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0716">
<meta name="description" content="Наведи камеру на карту Uzum — и она оживёт">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>*,*::before,*::after{box-sizing:border-box}img{max-width:100%}</style>
</head>
<body>
<title>Uzum AR-карта</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Golos+Text:wght@500;600&display=swap">
<style>
/* Layout: one full-bleed camera stage; floating glass controls top, chips + karaoke subtitles bottom; the card mascot is the show */
:root{
  --plum:#7000FF; --plum2:#4B00B5; --lilac:#C9B3FF; --mint:#3DF5B0; --sun:#FFE14D;
  --ink:#0B0716; --glass:rgba(255,255,255,.14); --glassLine:rgba(255,255,255,.28); --white:#FFFFFF;
  --f-display:"Unbounded","Segoe UI",system-ui,sans-serif;
  --f-body:"Golos Text","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);overscroll-behavior:none}
body{color:var(--white);font-family:var(--f-body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,#hero:focus-visible{outline:2px solid var(--mint);outline-offset:3px}

.stage{position:fixed;inset:0;overflow:hidden;background:#000;touch-action:manipulation}
.src{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:100%}
.vignette{position:absolute;inset:0;pointer-events:none;z-index:1;background:radial-gradient(120% 80% at 50% 45%,transparent 55%,rgba(11,7,22,.55) 100%)}
#fx{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
.flash{position:absolute;inset:0;z-index:6;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:flash .45s ease-out}
@keyframes flash{0%{opacity:.75}100%{opacity:0}}
.stage.shake{animation:shake .4s}
@keyframes shake{20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}

.reticle{position:absolute;left:50%;top:50%;width:min(72vw,340px);aspect-ratio:1.586;transform:translate(-50%,-50%);z-index:3;pointer-events:none;border-radius:18px}
.reticle i{position:absolute;width:34px;height:34px;border:4px solid var(--white);filter:drop-shadow(0 0 8px rgba(201,179,255,.9))}
.reticle i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-radius:16px 0 0 0}
.reticle i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-radius:0 16px 0 0}
.reticle i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 16px}
.reticle i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 16px 0}
.reticle{animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{transform:translate(-50%,-50%) scale(1.04)}}

#anchor{position:absolute;left:0;top:0;width:0;height:0;z-index:4;pointer-events:none}
#hero{position:absolute;left:0;top:0;z-index:5;width:260px;cursor:pointer;will-change:transform}
#hero .pop{transform:scale(0) translateY(40%) rotate(-12deg);transform-origin:56% 92%;transition:transform .7s cubic-bezier(.3,1.7,.5,1)}
#hero.in .pop{transform:none}
#hero svg{display:block;width:100%;height:auto;overflow:visible;filter:drop-shadow(0 18px 24px rgba(0,0,0,.45))}
.htag{position:absolute;bottom:84%;left:58%;max-width:210px;background:var(--white);color:var(--ink);font:800 14px/1.2 var(--f-display);padding:9px 13px;border-radius:18px 18px 18px 4px;box-shadow:0 8px 22px rgba(0,0,0,.35);transform-origin:0 100%;animation:tagIn .45s cubic-bezier(.3,1.7,.5,1);text-wrap:balance}
@keyframes tagIn{from{transform:scale(.2) rotate(-10deg);opacity:0}}

/* props that live on the card */
.stamp{position:absolute;left:50%;top:50%;font:800 clamp(28px,9vw,52px)/1 var(--f-display);color:var(--sun);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;white-space:nowrap;transform:translate(-50%,-50%) rotate(-12deg);animation:stampIn .5s cubic-bezier(.2,1.6,.5,1) both;text-shadow:0 6px 0 rgba(11,7,22,.6)}
@keyframes stampIn{from{transform:translate(-50%,-50%) scale(3.2) rotate(-30deg);opacity:0}}
.flyer{position:absolute;left:50%;top:50%;padding:8px 14px;border-radius:12px;font:800 15px var(--f-display);color:var(--ink);background:var(--white);box-shadow:0 8px 20px rgba(0,0,0,.4);white-space:nowrap}
.lock{position:absolute;left:50%;top:40%;width:84px;height:84px;transform:translate(-50%,-50%);animation:stampIn .5s cubic-bezier(.2,1.6,.5,1) both}
.lock svg{width:100%;height:100%;filter:drop-shadow(0 8px 14px rgba(0,0,0,.5))}
.orbit{position:absolute;left:50%;top:-55%;width:0;height:0;animation:orbit 2.4s linear infinite}
.orbit svg{position:absolute;left:150px;top:-22px;width:46px;height:46px;transform:rotate(90deg);filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
@keyframes orbit{to{transform:rotate(360deg)}}
.coin{position:absolute;left:0;top:0;width:58px;height:58px;margin:-29px 0 0 -29px;border:0;padding:0;background:none;pointer-events:auto;z-index:7}
.coin span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF3A8,#FFC531 55%,#D89400);border:4px solid #B87900;font:800 22px var(--f-display);color:#8A5A00;box-shadow:0 6px 14px rgba(0,0,0,.4)}
.plus{position:absolute;font:800 22px var(--f-display);color:var(--sun);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;pointer-events:none;z-index:8;animation:plus .8s ease-out forwards}
@keyframes plus{to{transform:translateY(-70px);opacity:0}}
.score{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);transform:translateX(-50%);z-index:8;padding:10px 18px;border-radius:999px;background:rgba(11,7,22,.6);border:1px solid var(--glassLine);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font:800 18px var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.score b{color:var(--sun)}

/* chrome */
.top{position:fixed;left:0;right:0;top:0;z-index:9;display:flex;align-items:center;gap:10px;padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.logo{font:800 17px var(--f-display);letter-spacing:-.01em;text-shadow:0 2px 10px rgba(0,0,0,.5);flex:1}
.logo span{color:var(--lilac)}
.round{pointer-events:auto;width:44px;height:44px;border-radius:50%;border:1px solid var(--glassLine);background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:grid;place-items:center}
.round svg{width:22px;height:22px}
.pill{pointer-events:auto;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--glassLine);background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font:600 13px var(--f-body)}

.bottom{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:60px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 22px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(to top,rgba(11,7,22,.82),rgba(11,7,22,.5) 55%,transparent);pointer-events:none}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;min-height:0}
.chip{pointer-events:auto;min-height:46px;padding:0 20px;border-radius:999px;border:1.5px solid rgba(255,255,255,.55);background:rgba(255,255,255,.18);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font:600 16px var(--f-body);animation:chipIn .4s cubic-bezier(.3,1.7,.5,1) both}
.chip.hot{background:var(--white);color:var(--plum2);border-color:var(--white)}
.chip:active{transform:scale(.94)}
@keyframes chipIn{from{transform:translateY(16px) scale(.7);opacity:0}}
.subs{max-width:34ch;text-align:center;font:800 clamp(17px,4.8vw,22px)/1.32 var(--f-display);letter-spacing:-.01em;text-wrap:balance;min-height:2.64em;text-shadow:0 2px 0 rgba(11,7,22,.9),0 0 18px rgba(11,7,22,.8)}
.subs w{color:rgba(255,255,255,.38);transition:color .12s}
.subs w.on{color:var(--white)}
.subs w.now{color:var(--sun)}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 66px);transform:translateX(-50%);z-index:10;max-width:calc(100% - 32px);padding:10px 16px;border-radius:14px;background:rgba(11,7,22,.75);border:1px solid var(--glassLine);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font:500 14px/1.35 var(--f-body);text-align:center;animation:chipIn .35s both}

/* start screen */
.start{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;background:radial-gradient(90% 60% at 50% 35%,#8B2BFF 0%,var(--plum) 35%,var(--plum2) 70%,var(--ink) 100%);padding-block:calc(env(safe-area-inset-top,0px) + 24px) calc(env(safe-area-inset-bottom,0px) + 24px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.start::before{content:"";position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 50% 38%,rgba(255,255,255,.06) 0 10deg,transparent 10deg 20deg);animation:spin 40s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.start img{position:relative;width:min(62vw,280px);max-width:100%;filter:drop-shadow(0 24px 30px rgba(0,0,0,.45));animation:hop 1.4s cubic-bezier(.4,0,.6,1) infinite}
@keyframes hop{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-18px) rotate(3deg)}}
.start h1{position:relative;margin:0;font:800 clamp(28px,8.5vw,44px)/1.05 var(--f-display);letter-spacing:-.02em;text-wrap:balance;max-width:12ch}
.start p{position:relative;margin:0;font:500 16px/1.45 var(--f-body);color:rgba(255,255,255,.82);max-width:32ch}
.go{position:relative;min-height:60px;padding:0 44px;border:0;border-radius:999px;background:var(--white);color:var(--plum2);font:800 19px var(--f-display);box-shadow:0 12px 30px rgba(0,0,0,.35),0 0 0 8px rgba(255,255,255,.18);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 12px 30px rgba(0,0,0,.35),0 0 0 16px rgba(255,255,255,.06)}}
.link{position:relative;background:none;border:0;font:600 15px var(--f-body);color:rgba(255,255,255,.85);text-decoration:underline;text-underline-offset:4px;padding:8px}
.note{position:relative;font:500 13px var(--f-body);color:rgba(255,255,255,.7)}
@media (prefers-reduced-motion:reduce){.start::before,.start img,.go,.reticle{animation:none}#hero .pop{transition:none}}
</style>

<main class="stage" id="stage">
  <video class="src" id="vid" playsinline muted hidden></video>
  <img class="src" id="photo" alt="" hidden>
  <canvas class="src" id="demo" hidden></canvas>
  <div class="vignette"></div>
  <canvas id="fx"></canvas>
  <div class="reticle" id="reticle" hidden><i></i><i></i><i></i><i></i></div>
  <div id="anchor"></div>
  <div id="hero" hidden role="button" tabindex="0" aria-label="Маскот карты Uzum, нажми на него">
    <div class="pop"><div class="htag" id="htag" hidden></div><svg viewBox="-200 -260 1420 1290" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs><clipPath id="mclip"><path id="mclipP"/></clipPath></defs>
          <ellipse id="gshadow" cx="600" cy="918" rx="330" ry="26" fill="#000" opacity=".3"/>
          <g id="rig">
            <g fill="none" stroke="#fff" stroke-linecap="round">
              <path id="oLA" stroke-width="40"/><path id="oLH" stroke-width="58"/><path id="oLF" stroke-width="26"/>
              <path id="oLL" stroke-width="40"/><path id="oLS" stroke-width="48"/>
              <path id="oRL" stroke-width="40"/><path id="oRS" stroke-width="48"/>
            </g>
            <g fill="none" stroke="#121212" stroke-linecap="round">
              <path id="LA" stroke-width="26"/><path id="LH" stroke-width="46"/><path id="LF" stroke-width="14"/>
              <path id="LL" stroke-width="26"/><path id="LS" stroke-width="36"/>
              <path id="RL" stroke-width="26"/><path id="RS" stroke-width="36"/>
            </g>
            <image id="bodyImg" href="body.webp" x="0" y="0" width="1003" height="923"/>
            <g transform="translate(540 341) rotate(27)">
              <ellipse cx="-95" cy="58" rx="28" ry="13" fill="#FF6FB5" opacity=".38"/>
              <ellipse cx="112" cy="58" rx="28" ry="13" fill="#FF6FB5" opacity=".38"/>
              <ellipse id="eL" rx="21" ry="27" fill="#141414"/><ellipse id="eR" rx="21" ry="27" fill="#141414"/>
              <circle id="gL" r="7" fill="#fff"/><circle id="gR" r="7" fill="#fff"/>
              <path id="aL" fill="none" stroke="#141414" stroke-width="9" stroke-linecap="round"/>
              <path id="aR" fill="none" stroke="#141414" stroke-width="9" stroke-linecap="round"/>
              <path id="bL" fill="none" stroke="#141414" stroke-width="8" stroke-linecap="round"/>
              <path id="bR" fill="none" stroke="#141414" stroke-width="8" stroke-linecap="round"/>
              <path id="mouth" fill="#141414" stroke="#141414" stroke-width="7" stroke-linejoin="round"/>
              <ellipse id="tongue" fill="#FF6FA8" clip-path="url(#mclip)"/>
            </g>
            <g fill="none" stroke="#fff" stroke-linecap="round">
              <path id="oRA" stroke-width="40"/><path id="oRH" stroke-width="58"/><path id="oRF" stroke-width="26"/>
            </g>
            <g fill="none" stroke="#121212" stroke-linecap="round">
              <path id="RA" stroke-width="26"/><path id="RH" stroke-width="46"/><path id="RF" stroke-width="14"/>
            </g>
            <g id="coin" opacity="0">
              <circle r="46" fill="#FFC531" stroke="#B87900" stroke-width="7"/>
              <text y="17" text-anchor="middle" font-family="Unbounded, sans-serif" font-weight="700" font-size="48" fill="#B87900">%</text>
            </g>
          </g>
        </svg></div>
  </div>
  <div class="flash" id="flash"></div>
</main>

<header class="top">
  <div class="logo">uzum <span>AR</span></div>
  <button class="pill" id="camPill" hidden>Включить камеру</button>
  <button class="round" id="soundBtn" aria-label="Выключить звук" aria-pressed="true">
    <svg id="icoOn" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
    <svg id="icoOff" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="m22 9-6 6M16 9l6 6"/></svg>
  </button>
  <button class="round" id="againBtn" aria-label="Начать сначала">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
  </button>
</header>

<section class="bottom">
  <div class="chips" id="chips"></div>
  <div class="subs" id="subs" aria-live="polite"></div>
</section>

<section class="start" id="start">
  <img src="mascot.webp" alt="Маскот карты Uzum">
  <h1>Оживи свою карту Uzum</h1>
  <p>Наведи камеру на карту — она выпрыгнет, заговорит и покажет пару фокусов.</p>
  <button class="go" id="goBtn">Начать</button>
  <button class="link" id="demoBtn">Нет карты под рукой? Смотреть демо</button>
  <div class="note">Со звуком · нужна камера</div>
</section>

<script>
const $=s=>document.querySelector(s);
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
/* ---------------- rig: poses ---------------- */
const SL=[217,294], SR=[960,500], HL=[440,668], HR=[810,731], PIV=[600,905];
const base={lc:[-70,70],le:[-60,190],rc:[70,70],re:[60,190],llc:[-10,120],lle:[-50,232],rlc:[10,70],rle:[28,150],
  m:[44,8,46],eye:1,ex:0,ey:0,brow:0,tilt:0,hop:0,sq:0,ol:0,or:0,coin:0};
const pose=(o,osc)=>Object.assign(JSON.parse(JSON.stringify(base)),o,{osc});
const S_=Math.sin, A_=Math.abs;
const POSES={
  idle: pose({},(t,s)=>{s.sq+=S_(t*.003)*.012; s.le[0]+=S_(t*.002)*8; s.re[0]-=S_(t*.002)*8;}),
  wave: pose({lc:[-140,-40],le:[-150,-235],m:[52,8,60],tilt:-4,ol:1},(t,s)=>{s.le[0]+=S_(t*.013)*48; s.lc[0]+=S_(t*.013)*18; s.sq+=S_(t*.003)*.01;}),
  shrug:pose({lc:[-120,0],le:[-235,-80],rc:[120,0],re:[235,-80],ol:1,or:1,m:[24,-4,44],eye:1.25,brow:1},(t,s)=>{const k=A_(S_(t*.006)); s.le[1]-=k*26; s.re[1]-=k*26; s.hop-=k*10; s.tilt+=S_(t*.003)*3;}),
  proud:pose({lc:[-150,90],le:[10,190],rc:[150,90],re:[-10,190],m:[58,4,38],eye:.35,tilt:-3},(t,s)=>{s.tilt+=S_(t*.0025)*3; s.sq+=S_(t*.003)*.01;}),
  point:pose({rc:[120,-40],re:[255,-185],or:.35,ex:12,m:[44,6,44],tilt:5},(t,s)=>{s.re[0]+=S_(t*.008)*10; s.re[1]+=S_(t*.008)*6;}),
  dance:pose({lc:[-60,-140],le:[-40,-285],rc:[60,-140],re:[40,-285],ol:.8,or:.8,m:[54,8,62],eye:.35},(t,s)=>{const w=t*.008; s.tilt+=S_(w)*10; s.hop-=A_(S_(w))*70; s.le[0]+=S_(w*2)*40; s.re[0]-=S_(w*2)*40; s.lle[1]-=Math.max(0,S_(w))*70; s.rle[1]-=Math.max(0,-S_(w))*50; s.lle[0]-=Math.max(0,S_(w))*30;}),
  coin: pose({rc:[90,20],re:[150,-95],or:1,coin:1,ey:-8,ex:8,m:[48,6,54]},(t,s)=>{s.re[1]+=A_(S_(t*.009))*14;}),
  think:pose({rc:[120,-70],re:[-25,-205],or:.6,ex:10,ey:-10,m:[18,-2,6],brow:.7,tilt:-6},(t,s)=>{s.re[0]+=S_(t*.035)*12; s.re[1]+=S_(t*.035)*5; s.ex+=S_(t*.002)*5;}),
  shush:pose({lc:[30,175],le:[292,128],ol:.3,lfront:1,m:[13,0,18],tilt:-5},(t,s)=>{s.ex=S_(t*.0035)*14; s.ey=-3;}),
  five: pose({rc:[60,-160],re:[100,-335],or:1,m:[56,8,62],brow:.4},(t,s)=>{s.re[1]+=S_(t*.01)*12; s.re[0]+=S_(t*.01)*6; s.hop-=A_(S_(t*.005))*14;}),
  giggle:pose({lc:[60,80],le:[185,60],rc:[-60,80],re:[-185,60],eye:.3,m:[50,10,46]},(t,s)=>{s.tilt+=S_(t*.05)*6; s.sq+=S_(t*.06)*.03; s.hop-=A_(S_(t*.02))*12;}),
  sad:  pose({lc:[-40,90],le:[-30,212],rc:[40,90],re:[30,212],m:[34,-26,6],eye:.85,brow:.8,tilt:8,ey:6},(t,s)=>{s.ex=S_(t*.006)*16;}),
  look: pose({ey:14,ex:4,m:[30,0,30],eye:1.15,brow:.6,lc:[-80,40],le:[-120,150]},(t,s)=>{s.tilt+=S_(t*.003)*2;})
};
const S=JSON.parse(JSON.stringify(base));
let lFront=false;
function setLeftFront(on){ if(on===lFront) return; lFront=on; const back=[R.oLA.parentNode,R.LA.parentNode], front=[R.oRA.parentNode,R.RA.parentNode];
  const tgt=on?front:back; ["oLA","oLH","oLF"].forEach(k=>tgt[0].appendChild(R[k])); ["LA","LH","LF"].forEach(k=>tgt[1].appendChild(R[k])); }
let poseName="idle", tempPose=null, tempUntil=0, talking=false, blinkAt=0, blinkUntil=0;
const el=id=>document.getElementById(id);
const R={}; ["oLA","oLH","oLF","oLL","oLS","oRL","oRS","LA","LH","LF","LL","LS","RL","RS","oRA","oRH","oRF","RA","RH","RF","eL","eR","gL","gR","aL","aR","bL","bR","mouth","tongue","mclipP","rig","coin","gshadow"].forEach(k=>R[k]=el(k));

function lerpState(T,k){
  for(const key in base){
    if(Array.isArray(base[key])) for(let i=0;i<S[key].length;i++) S[key][i]+= (T[key][i]-S[key][i])*k;
    else S[key]+= (T[key]-S[key])*k;
  }
}
const f1=n=>Math.round(n*10)/10;

const stage=$("#stage"), vid=$("#vid"), photo=$("#photo"), demo=$("#demo"), fx=$("#fx"), hero=$("#hero");
const work=document.createElement("canvas"), wctx=work.getContext("2d",{willReadFrequently:true});
function detect(srcEl, sw, sh){
  const W=80, H=Math.max(24, Math.round(W*sh/sw));
  work.width=W; work.height=H;
  try{ wctx.drawImage(srcEl,0,0,W,H); }catch(e){ return null; }
  const d=wctx.getImageData(0,0,W,H).data, N=W*H, m=new Uint8Array(N);
  for(let i=0,p=0;i<N;i++,p+=4){
    const r=d[p]/255,g=d[p+1]/255,b=d[p+2]/255, mx=Math.max(r,g,b), mn=Math.min(r,g,b), c=mx-mn;
    if(mx<.16 || c/mx<.35) continue;
    let h = mx===r ? ((g-b)/c)%6 : mx===g ? (b-r)/c+2 : (r-g)/c+4;
    h*=60; if(h<0) h+=360;
    if(h>=245 && h<=302) m[i]=1;
  }
  const lab=new Uint8Array(N), st=[]; let best=null;
  for(let i=0;i<N;i++){
    if(!m[i]||lab[i]) continue;
    let cnt=0,x0=W,y0=H,x1=0,y1=0; st.push(i); lab[i]=1;
    while(st.length){
      const k=st.pop(), x=k%W, y=(k/W)|0; cnt++;
      if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y;
      if(x>0   && m[k-1] && !lab[k-1]){lab[k-1]=1;st.push(k-1);}
      if(x<W-1 && m[k+1] && !lab[k+1]){lab[k+1]=1;st.push(k+1);}
      if(y>0   && m[k-W] && !lab[k-W]){lab[k-W]=1;st.push(k-W);}
      if(y<H-1 && m[k+W] && !lab[k+W]){lab[k+W]=1;st.push(k+W);}
    }
    if(!best||cnt>best.cnt) best={cnt,x0,y0,x1,y1};
  }
  if(!best) return null;
  const bw=best.x1-best.x0+1, bh=best.y1-best.y0+1, ar=bw/bh;
  if(best.cnt/N < .025 || best.cnt/(bw*bh) < .4 || ar<.35 || ar>3.4) return null;
  return {x:best.x0/W, y:best.y0/H, w:bw/W, h:bh/H};
}

function buildSubs(text){

  text.split(" ").forEach((w,i)=>{ const el=document.createElement("w"); el.textContent=(i?" ":"")+w; subsEl.appendChild(el); words.push({el,start:pos}); pos+=w.length+1; });

function say(text){
  const my=++sayToken; stopSpeech(); buildSubs(text); talking=true; subStart=performance.now(); boundarySeen=false;
  return new Promise(res=>{
    let done=false, safety=0;
    const fin=()=>{ if(done) return; done=true; clearTimeout(safety); if(my===sayToken){ talking=false; highlight(1e9); } res(); };
    const est=Math.max(1300,text.length*estMsPerChar);

      try{
        const u=new SpeechSynthesisUtterance(text); u.lang="ru-RU"; u.rate=1.06; u.pitch=1.45; if(ruVoice) u.voice=ruVoice;

        u.onend=fin; u.onerror=fin; speechSynthesis.speak(u);

  setPose("proud"); clearProps();
  const a=prop('<div class="flyer">Uzcard</div>'), b=prop('<div class="flyer">Humo</div>');
  const fly=(el,dx,delay)=>el.animate([{transform:`translate(-50%,-50%) translate(${dx}vw,-30vh) rotate(${dx>0?20:-20}deg)`,opacity:0},{offset:.2,opacity:1},{transform:"translate(-50%,-50%) scale(.2)",opacity:0}],{duration:1300,delay,easing:"cubic-bezier(.5,0,.8,1)",fill:"both"});
  fly(a,-70,0); fly(b,70,350); SFX.whoosh(); setTimeout(()=>{ SFX.ding(); if(lastP) burst(lastP.x+lastP.w/2,lastP.y+lastP.h/2,40,"star"); },1250); setTimeout(()=>{ SFX.ding(); },1600);
  await say("Пополняй меня с Uzcard и Humo любого банка без комиссии — прямо в приложении Uzum Bank."); if(!alive(id)) return;
  const c=await choose(["А в терминале?","Удобно!"],7000); if(!alive(id)) return;
  if(c===0){ setPose("shrug"); await say("Терминал берёт комиссию. Приложение — ноль. Выбор очевиден."); } else { react("giggle",1000); await say("Ещё бы!"); }
  clearProps();
}
async function sceneTransfer(id){
  setPose("point"); clearProps();
  await say("Переводы на другие карты Uzum — бесплатно. Давай отправим другу?"); if(!alive(id)) return;
  await choose(["Отправить!"],6000); if(!alive(id)) return;
  const pl=prop('<div class="flyer" style="background:none;box-shadow:none;padding:0;width:56px;height:56px">'+PLANE+'</div>');
  pl.animate([{transform:"translate(-50%,-50%) scale(.6)"},{transform:"translate(40vw,-60vh) scale(1.4) rotate(-10deg)",opacity:1},{transform:"translate(60vw,-90vh) scale(.8)",opacity:0}],{duration:1500,easing:"cubic-bezier(.3,.1,.6,1)",fill:"both"});
  SFX.plane(); react("five",900);
  await say("Улетело! И без комиссии."); clearProps();
}
async function sceneVisa(id){
  setPose("dance"); clearProps(); prop('<div class="orbit">'+PLANE+'</div>'); SFX.sparkle();
  await say("А ещё я — Visa. Работаю в магазинах, онлайн и за границей. Обожаю путешествовать!"); if(!alive(id)) return;
  const c=await choose(["Потанцуй ещё!","Дальше"],6000); if(!alive(id)) return;
  if(c===0){ SFX.fanfare(); await say("Ну раз просишь! Оп-оп-оп!"); await sleep(1200); }
  clearProps();
}
async function sceneCashback(id){
  setPose("coin"); clearProps();
  await say("А ещё я возвращаю деньги — кэшбэк! Лови монетки, жми на них!"); if(!alive(id)) return;
  const n=await coinGame(id, 9000); if(!alive(id)) return;
  setPose("proud"); SFX.fanfare();
  await say(n>0 ? `Поймал ${n}! Вот так и капает кэшбэк. А в Uzum Market и Uzum Tezkor для меня ещё и спецпредложения.` : "Монетки убежали! Ничего, с покупок кэшбэк капает сам. А в Uzum Market и Uzum Tezkor для меня ещё и спецпредложения.");
}
function coinGame(id,dur){
  return new Promise(res=>{
    let caught=0; const coins=[]; const sc=document.createElement("div"); sc.className="score"; sc.innerHTML='Кэшбэк: <b>0</b>'; stage.appendChild(sc);
    const t0=performance.now(); let lastSpawn=0;
    const step=t=>{
      if(!alive(id) || t-t0>dur){ coins.forEach(c=>c.el.remove()); sc.remove(); res(caught); return; }
      if(t-lastSpawn>420){ lastSpawn=t; const h=handPoint(); const el=document.createElement("button"); el.className="coin"; el.setAttribute("aria-label","Поймать монетку"); el.innerHTML="<span>%</span>";
        const c={el,x:h.x,y:h.y,vx:(Math.random()*2-1)*3.2-1.6,vy:-(6+Math.random()*5),dead:false};
        el.onpointerdown=e=>{ e.preventDefault(); if(c.dead) return; c.dead=true; caught++; sc.innerHTML=`Кэшбэк: <b>${caught}</b>`; SFX.ding(); burst(c.x,c.y,18,"star");
          const pl=document.createElement("div"); pl.className="plus"; pl.textContent="+1"; pl.style.left=(c.x-12)+"px"; pl.style.top=(c.y-20)+"px"; stage.appendChild(pl); setTimeout(()=>pl.remove(),800); el.remove(); };
        stage.appendChild(el); coins.push(c); SFX.pop(); }
      const H=stage.clientHeight;
      coins.forEach(c=>{ if(c.dead) return; c.vy+=.32; c.x+=c.vx; c.y+=c.vy; c.el.style.transform=`translate(${c.x}px,${c.y}px) rotate(${c.x*2}deg)`; if(c.y>H+60){ c.dead=true; c.el.remove(); } });
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}
async function scenePin(id){
  setPose("shush"); clearProps(); prop(LOCK); SFX.lock();
  await say("Тсс… Секрет. Никому не говори мой ПИН-код и три цифры на обороте. Даже если звонят «из банка». Особенно если звонят «из банка»."); if(!alive(id)) return;
  await choose(["Обещаю!"],6000); if(!alive(id)) return;
  react("giggle",1200); SFX.giggle(); await say("Верю! Мы теперь команда."); clearProps();
}
async function sceneFive(id){
  setPose("five"); tag("Дай пять!",9000);
  await say("А теперь — дай пять! Жми на меня!"); if(!alive(id)) return;
  const got=await Promise.race([new Promise(r=>heroWait=r), choose(["Дай пять!"],10000).then(()=>true)]);
  heroWait=null; cancelChoice(); if(!alive(id)) return;
  const h=handPoint(); burst(h.x,h.y,140); burst(h.x,h.y,40,"star"); ring(h.x,h.y); SFX.pop(); SFX.fanfare(); $("#flash").classList.remove("go"); void $("#flash").offsetWidth; $("#flash").classList.add("go");
  setPose("dance"); tag("Е-е-е!",2000);
  await say("Е-е-е! Оформи меня в приложении Uzum Bank, а пластик забери в пункте выдачи Uzum Market. Пока-пока!"); if(!alive(id)) return;
  setPose("wave");
  const c=await choose(["Ещё раз!"],60000); if(c===0 && alive(id)) restartStory();
}
const SCENES=[sceneHello,sceneZero,sceneTopup,sceneTransfer,sceneVisa,sceneCashback,scenePin,sceneFive];
async function runStory(from){
  const id=++storyId;
  for(let i=from;i<SCENES.length;i++){ if(!alive(id)) return; sceneI=i; await SCENES[i](id); if(!alive(id)) return; await sleep(350); }
}
function restartStory(){ storyId++; cancelChoice(); stopSpeech(); clearProps(); sceneI=0; if(shown) runStory(0); }

/* ================= appear / leave ================= */
let firstMeet=true;
function appear(){
  shown=true; hero.hidden=false;
  if(lastP){ const cx=lastP.x+lastP.w/2, cy=lastP.y+lastP.h/2; ring(cx,cy); setTimeout(()=>ring(cx,cy),140); burst(cx,cy,60,"star"); }
  $("#flash").classList.remove("go"); void $("#flash").offsetWidth; $("#flash").classList.add("go");
  SFX.whoosh(); setTimeout(SFX.pop,180);
  requestAnimationFrame(()=>hero.classList.add("in"));
  const from=sceneI; setTimeout(()=>{ if(shown) runStory(firstMeet?0:from); firstMeet=false; }, 700);
}
function startLeaving(){
  storyId++; cancelChoice(); stopSpeech(); setPose("sad"); tag("Эй, ты куда?",1500); buildSubs("Эй, ты куда? Верни меня в кадр!"); highlight(1e9); SFX.boing();
  leaving=setTimeout(()=>{ leaving=0; shown=false; hero.classList.remove("in"); clearProps(); setTimeout(()=>{ if(!shown) hero.hidden=true; },600); },900);
}
function returnBack(){ shown=true; react("giggle",900); tag("Фух, нашёлся!",1300); SFX.giggle(); setTimeout(()=>{ if(shown) runStory(sceneI); },900); }

/* ================= loop ================= */
let scanBeep=0;
function tick(t){
  if(mode==="demo") drawDemo(t);
  const s=source(); let p=null;
  if(s){
    frames++;
    const r=(frames%2===0||!box)?detect(s.el,s.w,s.h):{...box};
    if(r){
      miss=0; seen++; box=box?lerpBox(box,r,.35):r; p=toStage(box,s); lastP=p; $("#reticle").hidden=true; placeHero(p);
      if(!shown && t-scanBeep>180){ scanBeep=t; SFX.scan(); }
      if(leaving){ clearTimeout(leaving); leaving=0; returnBack(); }
      if(seen>=4 && !shown && !hero.classList.contains("in")) appear();
    } else {
      seen=0; miss++;
      if(box && miss<=18){ p=toStage(box,s); }
      if(miss>18){ box=null; if(!shown||leaving) $("#reticle").hidden=false; if(shown && !leaving) startLeaving(); }
    }
  }
  drawFx(p, p && !shown);
  if(!hero.hidden) renderRig(t);
  tickSubs(t);
  raf=requestAnimationFrame(tick);
}

/* ================= modes / start ================= */
function stopStream(){ if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } }
function setMode(m){
  cancelAnimationFrame(raf); storyId++; cancelChoice(); stopSpeech(); clearTimeout(leaving); leaving=0;
  mode=m; box=null; seen=0; miss=0; frames=0; shown=false; firstMeet=true; sceneI=0; poseName="idle";
  hero.classList.remove("in"); hero.hidden=true; $("#htag").hidden=true; clearProps();
  vid.hidden=m!=="cam"; demo.hidden=m!=="demo"; $("#start").hidden=true; $("#reticle").hidden=false;
  $("#camPill").hidden=m!=="demo";
  buildSubs(m==="demo" ? "Это демо. Смотри, сейчас я оживу!" : "Наведи камеру на карту Uzum…"); highlight(1e9);
  if(m==="demo") sizeDemo();
  raf=requestAnimationFrame(tick);
}
async function startCamera(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280}},audio:false});
    vid.srcObject=stream; await vid.play(); setMode("cam"); return true;
  }catch(e){ stopStream(); return false; }
}
function unlockAudio(){
  ac(); SFX.pop();
  try{ const u=new SpeechSynthesisUtterance(" "); u.volume=0; speechSynthesis.speak(u); }catch(e){}
  try{ document.documentElement.requestFullscreen && document.documentElement.requestFullscreen({navigationUI:"hide"}).catch(()=>{}); }catch(e){}
  try{ navigator.wakeLock && navigator.wakeLock.request("screen").catch(()=>{}); }catch(e){}
}
$("#goBtn").onclick=async()=>{
  unlockAudio();
  const ok=await startCamera();
  if(!ok){ setMode("demo"); toast("Камера недоступна — включил демо. Разреши доступ к камере в браузере и нажми «Включить камеру»."); }
};
$("#demoBtn").onclick=()=>{ unlockAudio(); setMode("demo"); };
$("#camPill").onclick=async()=>{ const ok=await startCamera(); if(!ok) toast("Браузер не дал доступ к камере. Разреши его в настройках сайта."); };
$("#againBtn").onclick=()=>{ SFX.pop(); if(shown) restartStory(); };
$("#soundBtn").onclick=()=>{
  soundOn=!soundOn; $("#soundBtn").setAttribute("aria-pressed",String(soundOn)); $("#soundBtn").setAttribute("aria-label",soundOn?"Выключить звук":"Включить звук");
  $("#icoOn").hidden=!soundOn; $("#icoOff").hidden=soundOn; if(!soundOn) stopSpeech(); else SFX.pop();
};
const TICKLES=["Ой, щекотно!","Эй, это мой чип!","Я карта, а не кнопка лифта!","Хи-хи!","Осторожно, я бесконтактный!","Ещё раз — и начислю кэшбэк за щекотку!"];
let lastTickle=-1;
function onHeroTap(){
  if(!shown) return;
  if(heroWait){ const r=heroWait; heroWait=null; r(true); return; }
  let i; do{ i=Math.floor(Math.random()*TICKLES.length); }while(i===lastTickle); lastTickle=i;
  react("giggle",1300); SFX.giggle(); tag(TICKLES[i],1500); const h=heroRect(); burst(h.x+h.w*.5,h.y+h.h*.35,24,"star");
}
hero.addEventListener("pointerdown",e=>{ e.preventDefault(); onHeroTap(); });
hero.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); onHeroTap(); } };
addEventListener("resize",()=>{ if(mode==="demo") sizeDemo(); });
</script>
